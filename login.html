<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
</head>
<body>
  <h2>Login</h2>
  <input type="email" id="email" placeholder="Email" />
  <input type="password" id="senha" placeholder="Senha" />
  <button onclick="login()">Entrar</button>
  <p id="erro" style="color:red;"></p>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

  <script>
    // CONFIGURAÇÃO DO SEU PROJETO FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyD2iYpYWsqU_JDF0D4KdUmkdxXXft1BXB8",
      authDomain: "fechaduradigital-6f390.firebaseapp.com",
      databaseURL: "https://fechaduradigital-6f390-default-rtdb.firebaseio.com",
      projectId: "fechaduradigital-6f390",
      storageBucket: "fechaduradigital-6f390.firebasestorage.app",
      messagingSenderId: "861590666749",
      appId: "1:861590666749:web:2b7eca2e3385afde3fed94"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function login() {
      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;
      auth.signInWithEmailAndPassword(email, senha)
        .then(() => {
          window.location.href = "painel.html";
        })
        .catch(error => {
          document.getElementById("erro").innerText = error.message;
        });
    }
  </script>
</body>
</html>

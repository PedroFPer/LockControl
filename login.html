<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css">
  <title>Login</title>
</head>
<body>
  <div class="conteiner">
    <h2>Login</h2>
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="senha" placeholder="Senha" />
    <button onclick="login()">Entrar</button>
    <p id="erro" style="color:red;"></p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

  <script>
    // CONFIGURAÇÃO DO SEU PROJETO FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyBSceiX4wHNKL4N_9kYkhiOJKQKE2-5Pp8",
      authDomain: "porta-online.firebaseapp.com",
      databaseURL: "https://porta-online-default-rtdb.firebaseio.com",
      projectId: "porta-online",
      storageBucket: "porta-online.firebasestorage.app",
      messagingSenderId: "902940273784",
      appId: "1:902940273784:web:bb1de873ca66ee0d7f518d"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function login() {
      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;
      auth.signInWithEmailAndPassword(email, senha)
        .then(() => {
          window.location.href = "painel.html";
        })
        .catch(error => {
          document.getElementById("erro").innerText = error.message;
        });
    }
  </script>
</body>
</html>

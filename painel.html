<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Painel de Registro</title>
</head>
<body>
  <h2>Registrar Usuário no Banco</h2>
  <input type="text" id="nome" placeholder="Nome" />
  <input type="email" id="emailCadastro" placeholder="Email" />
  <input type="password" id="senhaCadastro" placeholder="Senha" />
  <button onclick="registrar()">Registrar</button>
  <p id="status" style="color:green;"></p>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

  <script>
    // MESMA CONFIGURAÇÃO
    const firebaseConfig = {
      apiKey: "AIzaSyD2iYpYWsqU_JDF0D4KdUmkdxXXft1BXB8",
      authDomain: "fechaduradigital-6f390.firebaseapp.com",
      databaseURL: "https://fechaduradigital-6f390-default-rtdb.firebaseio.com",
      projectId: "fechaduradigital-6f390",
      storageBucket: "fechaduradigital-6f390.firebasestorage.app",
      messagingSenderId: "861590666749",
      appId: "1:861590666749:web:2b7eca2e3385afde3fed94"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function registrar() {
      const nome = document.getElementById("nome").value;
      const email = document.getElementById("emailCadastro").value;
      const senha = document.getElementById("senhaCadastro").value;

      const userId = Date.now(); // ID temporário
      db.ref('usuarios/' + userId).set({
        nome: nome,
        email: email,
        senha: senha
      }).then(() => {
        document.getElementById("status").innerText = "Usuário registrado com sucesso!";
      }).catch(error => {
        document.getElementById("status").innerText = "Erro: " + error.message;
      });
    }
  </script>
</body>
</html>
